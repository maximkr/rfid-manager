version: 2

updates:
  # AndroidX, Kotlin, AGP и прочее из gradle/libs.versions.toml
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Мажорные обновления не предлагаем. Первый же запуск открыл PR
      # с AGP 8.13 -> 9.3 и Gradle 8.13 -> 9.7, и сборка на них падает.
      # Мажоры AGP и Gradle идут в связке и требуют ручной проверки,
      # автоматическим PR такое не решается.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
