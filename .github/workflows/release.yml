name: Release

# Запускается при пуше тега вида v1.1.0
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # создать GitHub Release

jobs:
  release:
    name: APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Релиз не выпускается, если юнит-тесты красные
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Ключ приезжает из секрета в base64 и кладётся во временный каталог
      # раннера, который удаляется вместе с машиной. Если секрет не задан,
      # сборка не падает — выпускается debug APK, как раньше.
      - name: Подготовить подпись
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Ключ получен, собираем подписанный release APK"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — будет собран debug APK"
          fi

      - name: Собрать подписанный release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Собрать debug APK (ключ не задан)
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew --no-daemon assembleDebug

      # Печатает отпечаток сертификата, которым подписан APK. Это публичная
      # информация — она есть в любом опубликованном APK. Сверьте SHA-256
      # с тем, что показывает RuStore, чтобы убедиться: ключ тот самый и
      # обновление встанет поверх магазинной версии.
      - name: Проверить подпись
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -Vr | head -1)
          "$APKSIGNER" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Удалить ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Подготовить артефакт
        run: |
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/rfid-manager-${GITHUB_REF_NAME}.apk"
            echo "APK_SUFFIX=" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk \
               "dist/rfid-manager-${GITHUB_REF_NAME}-debug.apk"
            echo "APK_SUFFIX=-debug" >> "$GITHUB_ENV"
          fi

      - name: Подготовить описание релиза
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cat > release-notes.md <<'EOF'
          ## Установка

          Скачайте `rfid-manager-TAG_PLACEHOLDER.apk` ниже и установите на устройство:

          ```bash
          adb install -r rfid-manager-TAG_PLACEHOLDER.apk
          ```

          Либо скопируйте файл на терминал и откройте через файловый менеджер,
          разрешив установку из неизвестных источников.

          APK подписан тем же ключом, что и сборка в
          [RuStore](https://www.rustore.ru/catalog/app/com.trackstudio.rfidmanager),
          поэтому ставится поверх магазинной версии как обычное обновление.

          Требуется Android 13 (API 33) или новее. Разрабатывалось и проверялось
          на **Chainway C5**.
          EOF
          else
            cat > release-notes.md <<'EOF'
          ## Установка

          **Основной способ — [RuStore](https://www.rustore.ru/catalog/app/com.trackstudio.rfidmanager).**

          Приложенный `rfid-manager-TAG_PLACEHOLDER-debug.apk` собран отладочным
          ключом: поверх версии из магазина он не встанет, Android откажет
          из-за несовпадения подписи.

          Требуется Android 13 (API 33) или новее.
          EOF
          fi
          sed -i "s/TAG_PLACEHOLDER/${GITHUB_REF_NAME}/g" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/rfid-manager-${GITHUB_REF_NAME}${APK_SUFFIX}.apk" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes
